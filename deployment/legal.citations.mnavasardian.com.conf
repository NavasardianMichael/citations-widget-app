# ==============================================================================
# legal.citations.mnavasardian.com — public static layer
# ==============================================================================
# Serves the legal pages Google Play requires (privacy policy, account deletion).
# Deliberately a separate server block and a separate domain from the API:
# api.citations.mnavasardian.com proxies to the Node container on 127.0.0.1:9003
# and has nothing to do with these files.
#
# Content is deployed by .github/workflows/deploy.yml straight into
#   $APP_DIR/legal/
# with rsync --delete. No releases and no symlink — two static files with no
# build step; git is the history. This config never needs touching again.
#
# This file is the source of truth and is copied to the host by hand. Get the
# certificate with `certbot certonly --webroot`, never `certbot --nginx`: the
# --nginx plugin rewrites the config in place, and those edits would be lost the
# next time this file is copied up. certonly only issues and renews the cert and
# leaves the config alone, which is what the acme-challenge location below is
# for. See README.md in this directory for the full sequence.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name legal.citations.mnavasardian.com www.legal.citations.mnavasardian.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the standalone `http2 on;` directive, which
    # only exists on nginx >= 1.25.1. This form works on every version; it emits
    # a deprecation warning on new ones, which is better than failing to boot on
    # old ones. Matches the API config on this same host.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name legal.citations.mnavasardian.com www.legal.citations.mnavasardian.com;

    # Both names are on one certificate; certbot must be given -d for each.
    ssl_certificate /etc/letsencrypt/live/legal.citations.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.citations.mnavasardian.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical URL. Play stores whatever you paste into the console and
    # re-checks it later, so the www form must resolve rather than 404 — but it
    # should land on the same address every time, not duplicate the page.
    if ($host = www.legal.citations.mnavasardian.com) {
        return 301 https://legal.citations.mnavasardian.com$request_uri;
    }

    root /home/michael/apps/citations/legal;

    # `$uri.html` is what makes both /privacy and /privacy.html resolve to the
    # same file. The pages cross-link each other with relative ./*.html hrefs, so
    # the .html form has to keep working; the bare form is what goes in the Play
    # Console, because a policy URL ending in .html looks like an artefact.
    location / {
        try_files $uri $uri.html =404;
    }

    # Play re-checks these URLs periodically and a stale copy is worse than a
    # slow one, so keep the window short.
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    gzip on;
    # text/html is always gzipped and must not be listed — nginx warns about a
    # duplicate MIME type if it is.
    gzip_types text/css;
    gzip_min_length 256;

    access_log /var/log/nginx/citations-legal.access.log;
    error_log  /var/log/nginx/citations-legal.error.log;
}
